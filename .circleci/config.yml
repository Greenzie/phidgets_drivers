version: 2.1

orbs:
  greenzie: greenzie/build_and_publish_debs@volatile

workflows:
  version: 2
  pushbuild:
    jobs:
      # Build jobs
      - greenzie/debian_build:
          name: "amd_debian_build"
          platform: amd64
          executor: greenzie/debianize_amd64

      # Deployment jobs
      - greenzie/debian_deploy_experimental:
          name: "deploy_amd64_greenzie"
          context: GREENZIE
          filters:
            branches:
              only:
                - noetic
          requires:
            - amd_debian_build
